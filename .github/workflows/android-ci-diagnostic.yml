name: Android CI Diagnostic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-build:
    name: Build Web + Android (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install npm dependencies (diagnostic)
        run: npm ci 2>&1 | tee npm-install.log

      - name: Build Web app (vite)
        run: npm run build 2>&1 | tee build.log

      - name: Install Capacitor CLI and add/sync Android
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli --no-audit --no-fund
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli add android 2>&1 | tee cap-add.log || true
          else
            npx --yes @capacitor/cli sync android 2>&1 | tee cap-sync.log || true
          fi

      - name: Run android patch script
        run: npm run android:patch 2>&1 | tee android-patch.log || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build Debug APK (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-assembleDebug.log || true

      - name: Build Release AAB (Gradle)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-bundleRelease.log || true

      - name: Upload logs and android folder
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostic-logs
          path: |
            npm-install.log
            build.log
            cap-add.log
            cap-sync.log
            android-patch.log
            gradle-assembleDebug.log
            gradle-bundleRelease.log
            android/**
          if-no-files-found: ignore
