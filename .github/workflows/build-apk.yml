name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: |
          node -v
          npm -v
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tee npm-install.log

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor and Android Project
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.expensediary.ai","appName":"Expense Diary","webDir":"dist","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli add android
          else
            npx --yes @capacitor/cli sync android
          fi

      - name: Run android patch scripts
        run: |
          npm run android:patch || true
          npm run android:patch-version || true

      - name: Fix Android SDK, Remove Cordova Conflict and Exclude Duplicates
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle 2>/dev/null || true
          sed -i '/android.enableJetifier/d' android/gradle.properties 2>/dev/null || true
          echo "android.enableJetifier=false" >> android/gradle.properties 2>/dev/null || true
          echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties 2>/dev/null || true
          sed -i "/capacitor-cordova-android-plugins/d" android/settings.gradle 2>/dev/null || true
          sed -i "/capacitor-cordova-android-plugins/d" android/app/build.gradle 2>/dev/null || true
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseDiary-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
