name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: |
          node -v
          npm -v
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor and Android Project
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.expensediary.ai","appName":"Expense Diary","webDir":"dist","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          else
            npx @capacitor/cli sync android
          fi

      - name: Run Android Patch Scripts
        run: |
          npm run android:patch
          npm run android:patch-version

      - name: Configure Android Gradle Settings
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle 2>/dev/null || true
          sed -i '/android.enableJetifier/d' android/gradle.properties 2>/dev/null || true
          echo "android.enableJetifier=false" >> android/gradle.properties
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties 2>/dev/null || true
          echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties
          sed -i "s|dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'|dirs 'libs'|g" android/app/build.gradle 2>/dev/null || true
          if ! grep -q "kotlin-stdlib-jdk7" android/app/build.gradle; then
            echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK with Gradle
        run: |
          cd android
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseDiary-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

