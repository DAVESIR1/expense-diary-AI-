name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor and Android Project
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.expensediary.ai","appName":"Expense Diary","webDir":"dist","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli add android
          else
            npx --yes @capacitor/cli sync android
          fi

      - name: Fix Android SDK, Gradle properties and Duplicate Classes
        run: |
          # 1. Ensure SDK 35
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle
          fi

          # 2. Add Jetifier and JVM flags to gradle.properties
          if [ -f "android/gradle.properties" ]; then
            echo "android.enableJetifier=true" >> android/gradle.properties
            echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties
          fi

          # 3. Prevent duplicate classes in app/build.gradle packagingOptions
          if [ -f "android/app/build.gradle" ] && ! grep -q "packagingOptions" android/app/build.gradle; then
            cat << 'EOF' >> android/app/build.gradle

android {
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
            pickFirsts += ['**/*.so', '**/libjsc.so', '**/libc++_shared.so']
        }
    }
}
configurations.all {
    resolutionStrategy {
        preferProjectModules()
    }
}
EOF
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseDiary-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
