<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Rounded container background -->
  <rect width="512" height="512" rx="128" fill="#064E3B"/>
  
  <!-- Subtle inner radial glow -->
  <circle cx="256" cy="180" r="220" fill="#047857" fill-opacity="0.25"/>

  <!-- Ledger Book Drop Shadow -->
  <rect x="124" y="114" width="264" height="314" rx="28" fill="#022C22" fill-opacity="0.4"/>

  <!-- Ledger Book Body (Ivory Paper) -->
  <rect x="132" y="104" width="248" height="304" rx="24" fill="#FAF8F5"/>

  <!-- Emerald Book Spine (Left) -->
  <path d="M132 128C132 114.745 142.745 104 156 104H178V408H156C142.745 408 132 397.255 132 384V128Z" fill="#047857"/>

  <!-- Gold Spine Accent Seam -->
  <line x1="178" y1="104" x2="178" y2="408" stroke="#F59E0B" stroke-width="4"/>

  <!-- Golden Bookmark Ribbon Hanging from Top -->
  <path d="M206 104H236V180L221 166L206 180V104Z" fill="#F59E0B"/>

  <!-- Financial Growth Bars -->
  <!-- Bar 1 (Mint) -->
  <rect x="228" y="318" width="24" height="46" rx="4" fill="#34D399"/>
  <!-- Bar 2 (Emerald) -->
  <rect x="264" y="286" width="24" height="78" rx="4" fill="#10B981"/>
  <!-- Bar 3 (Deep Emerald) -->
  <rect x="300" y="246" width="24" height="118" rx="4" fill="#059669"/>

  <!-- Upward Trend Line & Arrow -->
  <path d="M228 300L266 264L302 274L342 220" stroke="#047857" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M322 220H342V240" stroke="#047857" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Currency / Rupee Symbol (Embossed Slate) -->
  <path d="M260 148H320M260 168H310M278 148V192C300 192 300 168 278 168L320 216" stroke="#1F2937" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
